; Sobrescreve o pool padrão do php:8.3-fpm (www.conf). O prefixo "zz-" garante que este
; arquivo seja lido DEPOIS na ordem alfabética de /usr/local/etc/php-fpm.d/, então estes
; valores vencem.
;
; Dimensionado para o servidor atual: 4 vCPU / 8 GB RAM COMPARTILHADOS com o Evolution API e
; o FlowBridge — não é uma máquina dedicada a este projeto.
;
; Por que 16 e não 5 (o default da imagem):
;   - Com 5, cinco checkouts simultâneos (~1,3 s cada, esperando o Mercado Pago) travavam a
;     API inteira: painel, webhooks do WhatsApp e checkout dividiam as mesmas 5 vagas.
;   - Pico medido de um request real do Laravel: ~45 MB; com overhead do processo, ~60 MB.
;     16 × 60 MB ≈ 960 MB.
;   - Requests são I/O-bound (esperam Mercado Pago, MySQL, Redis), não CPU-bound — durante a
;     espera o worker não consome CPU, por isso vale ter mais workers que vCPUs.
;
; Por que 16 e não mais: a entrada do sistema é o WhatsApp, e são no máximo 2 números. O
; volume de mensagens que um número sustenta limita a chegada a poucos pedidos por MINUTO, o
; que exige uma fração desses workers. Passar disso só tiraria RAM do Evolution, que é quem
; de fato precisa (mantém as sessões do WhatsApp em memória) — e sem Evolution não entra
; pedido nenhum.
[www]
pm = dynamic
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8

; Recicla o worker a cada N requests. Protege contra vazamento de memória acumulado em
; processos longos, sem custo relevante (o respawn é barato).
pm.max_requests = 500

; Loga requests que passam de 10s — o checkout normal leva ~1,3s, então qualquer coisa
; nessa faixa indica API externa degradada e vale investigação.
slowlog = /proc/self/fd/2
request_slowlog_timeout = 10s

; Timeout de segurança: sem isso um request travado numa API externa prende o worker
; indefinidamente. 60s é folgado para o pior caso conhecido (Mercado Pago).
request_terminate_timeout = 60s
