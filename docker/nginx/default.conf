# Fica FORA do server{} de propósito: conf.d/*.conf é incluído dentro do http{}, então `map`
# é válido aqui e não exige tocar no nginx.conf nem no Dockerfile do nginx.
# `close` quando o cliente NÃO pediu upgrade evita quebrar o keep-alive das requisições
# normais que passarem por este location.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 20M;

    resolver 127.0.0.11 valid=10s;

    # WebSocket do Reverb — o pusher-js conecta em /app/{REVERB_APP_KEY}.
    #
    # O `^~` é OBRIGATÓRIO, não estilo: no nginx um location regex vence um prefix location
    # comum, então sem ele uma requisição como /app/algo.php cairia no `location ~ \.php$`
    # abaixo e o handshake viraria FastCGI. `^~` interrompe a avaliação de regex assim que o
    # prefixo casa.
    #
    # A barra final restringe a /app/... e em particular NÃO captura /apps/{id}/events — a API
    # HTTP assinada do Reverb, que deve continuar acessível só pela rede interna.
    location ^~ /app/ {
        # Variável + resolver = DNS resolvido em runtime, o que permite o nginx SUBIR mesmo se
        # o container `reverb` estiver fora. Com host literal o nginx falharia no start com
        # "host not found in upstream", derrubando a API inteira por causa do WebSocket.
        set $reverb reverb:8080;
        proxy_pass http://$reverb;

        proxy_http_version 1.1;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         $connection_upgrade;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        # Conexão longa: o proxy_read_timeout default (60s) mataria o socket exatamente na
        # fronteira do ping/pong do protocolo Pusher, que também é 60s.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
        proxy_cache         off;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        set $upstream app:9000;
        fastcgi_pass $upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\.ht {
        deny all;
    }
}
