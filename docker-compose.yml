x-laravel-environment: &laravel-environment
  APP_NAME: "${APP_NAME:-Zapediu}"
  APP_ENV: "${APP_ENV:-production}"
  APP_KEY: "${APP_KEY}"
  APP_DEBUG: "${APP_DEBUG:-false}"
  APP_URL: "${APP_URL:-https://api.zapediu.com}"
  FRONTEND_URL: "${FRONTEND_URL}"

  LOG_CHANNEL: "${LOG_CHANNEL:-stack}"
  LOG_STACK: "${LOG_STACK:-single}"
  LOG_LEVEL: "${LOG_LEVEL:-warning}"

  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: 3306
  DB_DATABASE: "${DB_DATABASE}"
  DB_USERNAME: "${DB_USERNAME}"
  DB_PASSWORD: "${DB_PASSWORD}"

  # phpredis (extensão C, instalada no Dockerfile) em vez de predis: sessão, cache e fila
  # vivem no Redis, então são caminhos de altíssima frequência.
  REDIS_CLIENT: "${REDIS_CLIENT:-phpredis}"
  REDIS_HOST: redis
  REDIS_PASSWORD: null
  REDIS_PORT: 6379

  SESSION_DRIVER: redis
  SESSION_LIFETIME: 120
  SESSION_ENCRYPT: "false"
  SESSION_PATH: /
  SESSION_DOMAIN: "${SESSION_DOMAIN:-.zapediu.com}"

  BROADCAST_CONNECTION: "${BROADCAST_CONNECTION:-reverb}"
  FILESYSTEM_DISK: local
  # Fila no Redis: o driver `database` fazia o worker rodar SELECT ... FOR UPDATE na tabela
  # `jobs` a cada 3s, criando contenção de lock no MySQL sob volume. O Redis usa BLPOP —
  # o worker fica bloqueado esperando o job em vez de consultar em laço.
  QUEUE_CONNECTION: redis
  CACHE_STORE: redis

  # Como o PHP (app/worker) alcança o Reverb: nome do serviço na rede interna, sem TLS.
  # NÃO confundir com as VITE_* abaixo, que dizem como o NAVEGADOR alcança — trocar os dois
  # é o erro mais comum deste setup.
  REVERB_APP_ID: "${REVERB_APP_ID}"
  REVERB_APP_KEY: "${REVERB_APP_KEY}"
  REVERB_APP_SECRET: "${REVERB_APP_SECRET}"
  REVERB_HOST: reverb
  REVERB_PORT: 8080
  REVERB_SCHEME: http
  # O navegador conecta em wss://<APP_URL>/app/<KEY>, terminado no proxy do Coolify e
  # repassado pelo nginx (location ^~ /app/) — daí porta 443/https.
  REVERB_SERVER_HOST: 0.0.0.0
  REVERB_SERVER_PORT: 8080

  ADMIN_API_TOKEN: "${ADMIN_API_TOKEN}"

  ZAPI_BASE_URL: "${ZAPI_BASE_URL:-https://api.z-api.io}"
  ZAPI_INSTANCE_ID: "${ZAPI_INSTANCE_ID}"
  ZAPI_INSTANCE_TOKEN: "${ZAPI_INSTANCE_TOKEN}"
  ZAPI_CLIENT_TOKEN: "${ZAPI_CLIENT_TOKEN}"
  ZAPI_WEBHOOK_TOKEN: "${ZAPI_WEBHOOK_TOKEN}"
  ZAPI_AUTO_REPLY_ENABLED: "${ZAPI_AUTO_REPLY_ENABLED:-true}"
  ZAPI_CAROUSEL_ENABLED: "${ZAPI_CAROUSEL_ENABLED:-true}"
  ZAPI_PAYMENT_BASE_URL: "${ZAPI_PAYMENT_BASE_URL}"

  MP_WEBHOOK_SECRET: "${MP_WEBHOOK_SECRET}"
  MERCADO_PAGO_ACCESS_TOKEN: "${MERCADO_PAGO_ACCESS_TOKEN}"

  FLOWBRIDGE_API_URL: "${FLOWBRIDGE_API_URL}"
  FLOWBRIDGE_API_KEY: "${FLOWBRIDGE_API_KEY}"
  FLOWBRIDGE_INSTANCE_ID: "${FLOWBRIDGE_INSTANCE_ID}"
  FLOWBRIDGE_TIMEOUT: "${FLOWBRIDGE_TIMEOUT:-15}"
  FLOWBRIDGE_WEBHOOK_SECRET: "${FLOWBRIDGE_WEBHOOK_SECRET}"
  FLOWBRIDGE_CALLBACK_BASE_URL: "${FLOWBRIDGE_CALLBACK_BASE_URL}"

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: "1000"
        GID: "1000"
    mem_limit: 1200m
    restart: unless-stopped
    user: "1000:1000"
    environment:
      <<: *laravel-environment
      RUN_MIGRATIONS: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - delivery-net

  # Servidor WebSocket. Mantenha UMA réplica: com duas, um cliente conectado na réplica A não
  # recebe evento publicado na B, e a falha é silenciosa — escalar exige REVERB_SCALING_ENABLED
  # (pub/sub no Redis) antes de subir a contagem.
  reverb:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: "1000"
        GID: "1000"
    mem_limit: 256m
    restart: unless-stopped
    user: "1000:1000"
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    environment:
      <<: *laravel-environment
      RUN_MIGRATIONS: "false"
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - delivery-net

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    mem_limit: 64m
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - app
      - reverb
    networks:
      - delivery-net

  db:
    image: mysql:8.4
    mem_limit: 1536m
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE}"
      MYSQL_USER: "${DB_USERNAME}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -uroot --silent"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - delivery-net

  redis:
    image: redis:7-alpine
    mem_limit: 512m
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      # Teto interno abaixo do mem_limit do container, para o Redis liberar espaço sozinho em
      # vez de ser morto por OOM pelo Docker (o que levaria junto a fila de jobs).
      - --maxmemory
      - "400mb"
      # `volatile-lru` e NÃO `allkeys-lru`: só descarta chaves COM expiração definida — cache e
      # sessão. Os jobs da fila são gravados SEM TTL, então nunca entram na conta de despejo.
      # Com `allkeys-lru`, encher a memória significaria descartar job de pedido pago.
      - --maxmemory-policy
      - volatile-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - delivery-net

  # Worker DEDICADO ao tempo real. Separado do worker geral de propósito: `broadcasts` só
  # carrega POSTs rápidos na rede interna (~20ms), enquanto `default` tem jobs de WhatsApp que
  # chegam a 15s (FLOWBRIDGE_TIMEOUT). Num worker compartilhado, bastava um job lento já em
  # execução para o alerta de pedido novo esperar atrás dele — anulando o ganho do WebSocket.
  # Prioridade por ordem na lista não resolve isso: ela só decide qual job pegar EM SEGUIDA.
  worker-broadcasts:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: "1000"
        GID: "1000"
    mem_limit: 160m
    restart: unless-stopped
    user: "1000:1000"
    command: php artisan queue:work --queue=broadcasts --sleep=1 --tries=3 --timeout=30
    environment:
      <<: *laravel-environment
      RUN_MIGRATIONS: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - delivery-net

  # Worker geral: pagamentos e notificações de WhatsApp. `payments` é a fila em que
  # PaymentWebhookController enfileira o ProcessMercadoPagoWebhookJob (->onQueue('payments'))
  # — sem nomeá-la aqui, nenhum PIX pago vira payment_status=paid.
  #
  # 3 réplicas porque estes jobs são I/O-bound (HTTP para FlowBridge e Mercado Pago): passam o
  # tempo esperando resposta, não consumindo CPU. Com uma só, um job de 15s bloqueava toda a
  # fila de notificações. Cada réplica custa ~35 MB (medido).
  # São três serviços iguais em vez de `deploy.replicas: 3` porque o Coolify atribui um
  # `container_name` fixo a cada serviço, e o Compose recusa nome fixo com mais de uma
  # réplica ("container name must be unique"). Declarados um a um, cada um ganha o seu nome
  # e os três consomem a MESMA fila do Redis — o efeito é idêntico ao das réplicas.
  worker: &worker
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: "1000"
        GID: "1000"
    mem_limit: 160m
    restart: unless-stopped
    user: "1000:1000"
    command: php artisan queue:work --queue=payments,default --sleep=3 --tries=3 --timeout=60
    environment:
      <<: *laravel-environment
      RUN_MIGRATIONS: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - delivery-net

  worker-2:
    <<: *worker

  worker-3:
    <<: *worker

  # O bootstrap/app.php agenda `orders:cleanup-pending` (15min) e
  # `orders:send-pending-payment-reminders` (5min), mas NENHUM processo executava o scheduler —
  # os dois comandos nunca rodaram em produção. `schedule:work` é o daemon que dispara isso
  # (equivalente ao cron, sem precisar de crontab no container).
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: "1000"
        GID: "1000"
    mem_limit: 160m
    restart: unless-stopped
    user: "1000:1000"
    command: php artisan schedule:work
    environment:
      <<: *laravel-environment
      RUN_MIGRATIONS: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - delivery-net

  adminer:
    image: adminer:5
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    labels:
      com.zapediu.role: adminer
    depends_on:
      db:
        condition: service_healthy
    networks:
      - delivery-net

volumes:
  db_data:
    external: true
    name: zapediuapi_db_data_prod

  redis_data:

networks:
  delivery-net:
    driver: bridge