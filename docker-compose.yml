x-laravel-environment: &laravel-environment
  APP_NAME: "${APP_NAME:-Zapediu}"
  APP_ENV: "${APP_ENV:-production}"
  APP_KEY: "${APP_KEY}"
  APP_DEBUG: "${APP_DEBUG:-false}"
  APP_URL: "${APP_URL:-https://api.zapediu.com}"
  FRONTEND_URL: "${FRONTEND_URL}"

  LOG_CHANNEL: "${LOG_CHANNEL:-stack}"
  LOG_STACK: "${LOG_STACK:-single}"
  LOG_LEVEL: "${LOG_LEVEL:-warning}"

  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: 3306
  DB_DATABASE: "${DB_DATABASE}"
  DB_USERNAME: "${DB_USERNAME}"
  DB_PASSWORD: "${DB_PASSWORD}"

  REDIS_CLIENT: "${REDIS_CLIENT:-predis}"
  REDIS_HOST: redis
  REDIS_PASSWORD: null
  REDIS_PORT: 6379

  SESSION_DRIVER: database
  SESSION_LIFETIME: 120
  SESSION_ENCRYPT: "false"
  SESSION_PATH: /
  SESSION_DOMAIN: "${SESSION_DOMAIN:-.zapediu.com}"

  BROADCAST_CONNECTION: log
  FILESYSTEM_DISK: local
  QUEUE_CONNECTION: database
  CACHE_STORE: database

  ADMIN_API_TOKEN: "${ADMIN_API_TOKEN}"

  ZAPI_BASE_URL: "${ZAPI_BASE_URL:-https://api.z-api.io}"
  ZAPI_INSTANCE_ID: "${ZAPI_INSTANCE_ID}"
  ZAPI_INSTANCE_TOKEN: "${ZAPI_INSTANCE_TOKEN}"
  ZAPI_CLIENT_TOKEN: "${ZAPI_CLIENT_TOKEN}"
  ZAPI_WEBHOOK_TOKEN: "${ZAPI_WEBHOOK_TOKEN}"
  ZAPI_AUTO_REPLY_ENABLED: "${ZAPI_AUTO_REPLY_ENABLED:-true}"
  ZAPI_CAROUSEL_ENABLED: "${ZAPI_CAROUSEL_ENABLED:-true}"
  ZAPI_PAYMENT_BASE_URL: "${ZAPI_PAYMENT_BASE_URL}"

  MP_WEBHOOK_SECRET: "${MP_WEBHOOK_SECRET}"
  MERCADO_PAGO_ACCESS_TOKEN: "${MERCADO_PAGO_ACCESS_TOKEN}"

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      <<: *laravel-environment
      RUN_MIGRATIONS: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - delivery-net

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - app
    networks:
      - delivery-net

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE}"
      MYSQL_USER: "${DB_USERNAME}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -uroot --silent"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - delivery-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - delivery-net

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=60
    environment:
      <<: *laravel-environment
      RUN_MIGRATIONS: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - delivery-net

  adminer:
    image: adminer:5
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    labels:
      com.zapediu.role: adminer
    depends_on:
      db:
        condition: service_healthy
    networks:
      - delivery-net

volumes:
  db_data:
    external: true
    name: zapediuapi_db_data

  redis_data:

networks:
  delivery-net:
    driver: bridge
